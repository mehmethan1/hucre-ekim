<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deney Zamanlayıcı</title>
<meta name="theme-color" content="#3a3fa0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="ortak.css">
<style>
.card-head h2{font-size:1.08rem;flex:1;min-width:0;overflow-wrap:anywhere}
.next{border:1.5px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.next.due{border-color:var(--bad);background:var(--bad-soft)}
.next .cd{font-family:var(--mono);font-size:1.7rem;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.steps{display:flex;flex-direction:column;gap:2px}
.stp{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.stp:last-child{border-bottom:none}
.stp input[type=checkbox]{width:24px;height:24px;margin:2px 0 0;accent-color:var(--accent)}
.stp .when{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem}
.stp .when strong{font-family:var(--mono)}
.stp .task{white-space:pre-line;margin-top:2px}
.stp.done .task{text-decoration:line-through;color:var(--muted)}
.edstep{display:grid;grid-template-columns:80px 1fr auto;gap:8px;align-items:start}
.timer{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.timer .clk{font-family:var(--mono);font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.timer.fin{border-color:var(--bad);background:var(--bad-soft);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{border-color:var(--warn)}}
.alarm{position:sticky;top:8px;z-index:5}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← Ana menü</a>
  <header>
    <span class="eyebrow">Zaman takibi</span>
    <h1>Deney zamanlayıcı</h1>
    <p>İlacı eklediğin an deneyi başlat. 24, 48 ve 72. saatte ne yapacağın listelenir, zamanı gelince işaretlersin.</p>
  </header>

  <div id="alarm" class="alarm" hidden></div>
  <div id="notifBox"></div>

  <div id="exps" style="display:flex;flex-direction:column;gap:18px"></div>

  <details class="more" id="newBox" style="background:var(--surface)">
    <summary>+ Yeni deney başlat</summary>
    <div class="in">
      <div class="field"><label for="tpl">Şablon</label><select id="tpl"></select></div>
      <div class="field"><label for="nName">Deney adı</label><input type="text" id="nName"></div>
      <div class="field"><span class="lbl">Hücre hatları</span><div class="chips" id="nLines"></div></div>
      <div class="field"><label for="nStart">İlacı ne zaman ekledin? (başlangıç)</label>
        <div style="display:flex;gap:8px"><input type="datetime-local" id="nStart" style="flex:1"><button type="button" id="nNow">Şimdi</button></div></div>
      <div class="field"><span class="lbl">Adımlar</span><div id="nSteps" class="muted small"></div></div>
      <button class="primary big" id="nGo">Deneyi başlat</button>
    </div>
  </details>

  <section class="panel">
    <h2>Hızlı sayaç</h2>
    <p class="muted small">Tripsin, santrifüj, inkübasyon gibi kısa bekleyişler için.</p>
    <div class="chips" id="presets"></div>
    <div style="display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:end">
      <div class="field"><label for="tLabel">Ne için</label><input type="text" id="tLabel" placeholder="ör. Tripsin"></div>
      <div class="field"><label for="tMin">Dakika</label><input type="text" class="mono" inputmode="decimal" id="tMin" placeholder="5"></div>
      <button class="primary" id="tGo">Başlat</button>
    </div>
    <div id="timers" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>
</div>

<script src="ortak.js"></script>
<script>
(function(){
const {fmt,num,esc,uid,load,save,dateStr,timeStr,toLocalInput,dur,clock}=Lab;
const KEY='sena-deney-v1';
const TEMPLATES={
  ilac:{label:'İlaç uygulaması · 24 / 48 / 72 saat',name:'İlaç uygulaması',steps:[
    [24,'Mikroskopta hücrelere bak, fotoğraf çek.'],
    [48,'Mikroskopta bak, fotoğraf çek.\nGerekirse ilaçlı medium\'u yenile.'],
    [72,'Canlılık ölçümü (MTT / CCK-8) ya da hücreleri topla (RNA / protein).']]},
  ilac2:{label:'İlaç uygulaması · 24 / 48 saat',name:'İlaç uygulaması',steps:[
    [24,'Mikroskopta bak, fotoğraf çek. 24 s grubunu topla / ölç.'],
    [48,'Mikroskopta bak, fotoğraf çek. 48 s grubunu topla / ölç.']]},
  trans:{label:'Transfeksiyon · 6 / 24 / 48 saat',name:'Transfeksiyon',steps:[
    [6,'Transfeksiyon medium\'unu taze tam medium ile değiştir.'],
    [24,'Mikroskop kontrolü (GFP varsa floresana bak).'],
    [48,'Hücreleri topla (RNA / protein).']]},
  bos:{label:'Boş şablon (adımları kendim yazacağım)',name:'Deney',steps:[[24,'']]}
};
let st=load(KEY,null);
if(!st||!Array.isArray(st.exps))st={exps:[],timers:[],tpl:'ilac'};
st.timers=st.timers||[];
const persist=()=>save(KEY,st);
const $=id=>document.getElementById(id);
const ui={};
const at=(e,s)=>+new Date(e.start)+num(s.h)*36e5;

// ---------- bildirim kutusu
function notifBox(){
  const b=$('notifBox');
  if(!Lab.canNotify()){b.innerHTML='<div class="msg info small">Bu tarayıcı bildirim desteklemiyor. Sayfa açıkken ses ve titreşimle uyarır; uzun süreli hatırlatmalar için "Takvime ekle"yi kullan.</div>';return}
  const p=Notification.permission;
  if(p==='granted'){b.innerHTML='<div class="msg ok small">Bildirimler açık. Sayfa açıkken (arka planda da olsa) zamanı gelince bildirim gelir. Telefon kilitli ve sayfa kapalıyken güvenilir hatırlatma için "Takvime ekle"yi kullan.</div>';return}
  if(p==='denied'){b.innerHTML='<div class="msg warn small">Bildirimler engelli. Tarayıcı ayarlarından bu siteye izin verebilirsin. O zamana kadar "Takvime ekle" ile telefonun takvimi hatırlatır.</div>';return}
  b.innerHTML='<div class="msg info small" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span>Zamanı gelince bildirim gelsin mi?</span><button class="sm primary" id="askN">Bildirimleri aç</button></div>';
  $('askN').onclick=async()=>{await Lab.askNotify();notifBox()};
}

// ---------- yeni deney formu
function lineNames(){const P=load('sena-pasaj-v1',null);const n=P&&P.lines&&P.lines.length?P.lines.map(l=>l.name).filter(Boolean):[];return n.length?n:['CCLP','R-CCLP','HuCCT','R-HuCCT']}
let sel=new Set(lineNames());
function newForm(){
  $('tpl').innerHTML=Object.entries(TEMPLATES).map(([k,t])=>`<option value="${k}">${esc(t.label)}</option>`).join('');
  $('tpl').value=st.tpl||'ilac';$('nName').value=TEMPLATES[$('tpl').value].name;
  $('nStart').value=toLocalInput(new Date());
  chips();stepsPrev();
}
function chips(){$('nLines').innerHTML=lineNames().map(n=>`<button type="button" class="sm" data-n="${esc(n)}" aria-pressed="${sel.has(n)}">${esc(n)}</button>`).join('')}
function stepsPrev(){const t=TEMPLATES[$('tpl').value];$('nSteps').innerHTML=t.steps.map(s=>`<div>• <strong>${s[0]}. saat:</strong> ${esc(s[1]||'(boş, sonra yazarsın)').replace(/\n/g,' ')}</div>`).join('')+'<div style="margin-top:4px">Başlattıktan sonra adımları düzenleyebilirsin.</div>'}
$('tpl').addEventListener('change',()=>{st.tpl=$('tpl').value;persist();$('nName').value=TEMPLATES[st.tpl].name;stepsPrev()});
$('nLines').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;const n=b.dataset.n;sel.has(n)?sel.delete(n):sel.add(n);chips()});
$('nNow').addEventListener('click',()=>$('nStart').value=toLocalInput(new Date()));
$('nGo').addEventListener('click',()=>{
  const t=TEMPLATES[$('tpl').value];const start=$('nStart').value?new Date($('nStart').value):new Date();
  const e={id:uid(),name:$('nName').value.trim()||t.name,lines:[...sel],start:start.toISOString(),
    steps:t.steps.map(s=>({id:uid(),h:String(s[0]),task:s[1],done:false})),notified:{}};
  // geçmiş adımlar için eski bildirim atma
  e.steps.forEach(s=>{if(at(e,s)<Date.now()-6e5){e.notified[s.id]=1;e.notified['p'+s.id]=1}});
  st.exps.unshift(e);ui[e.id]={fresh:true};persist();$('newBox').open=false;newForm();renderExps();
  document.querySelector(`[data-id="${e.id}"]`).scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
});

// ---------- deney kartları
function nextStep(e){return e.steps.filter(s=>!s.done).sort((a,b)=>at(e,a)-at(e,b))[0]}
function renderExps(){
  const box=$('exps');
  if(!st.exps.length){box.innerHTML='<div class="panel"><p class="muted">Devam eden deney yok. Aşağıdan "Yeni deney başlat"a dokun.</p></div>';$('newBox').open=true;return}
  box.innerHTML=st.exps.map(e=>{
    const u=ui[e.id]||{};const n=nextStep(e);const now=Date.now();
    const done=e.steps.filter(s=>s.done).length;
    let h=`<article class="card" data-id="${e.id}"><div class="card-head"><h2>${esc(e.name)}</h2>
      <span class="badge ${n?(at(e,n)<=now?'bad':'info'):'ok'}">${done}/${e.steps.length} adım</span></div><div class="card-body">
      <p class="muted small">Başlangıç: <strong>${dateStr(e.start)}</strong>${e.lines.length?' · '+e.lines.map(esc).join(', '):''}</p>`;
    if(u.fresh)h+=`<div class="msg info small" style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span>Sayfa kapalıyken de hatırlatsın diye adımları telefonunun takvimine ekle.</span><button class="sm primary" data-a="cal">Takvime ekle</button></div>`;
    if(u.edit){
      h+=`<div class="field"><label>Deney adı</label><input type="text" data-e="name" value="${esc(e.name)}"></div>
        <div class="field"><label>Başlangıç</label><input type="datetime-local" data-e="start" value="${toLocalInput(e.start)}"></div>
        <div style="display:flex;flex-direction:column;gap:8px">${e.steps.map(s=>`<div class="edstep" data-s="${s.id}">
          <div class="field"><label>Saat</label><input type="text" class="mono" inputmode="decimal" data-sk="h" value="${esc(s.h)}"></div>
          <div class="field"><label>Yapılacak</label><textarea data-sk="task" rows="2">${esc(s.task)}</textarea></div>
          <button class="sm ghost danger" data-a="sdel" style="margin-top:22px" aria-label="Adımı sil">Sil</button></div>`).join('')}</div>
        <div class="actions"><button data-a="sadd">+ Adım ekle</button><button class="primary" data-a="edone">Bitti</button></div>`;
    }else{
      if(n){const t=at(e,n),due=t<=now;
        h+=`<div class="next ${due?'due':''}"><span class="eyebrow">${due?'Zamanı geldi':'Sıradaki'} · ${fmt(num(n.h),num(n.h)%1?1:0)}. saat · ${dateStr(t)}</span>
          <span class="cd" data-cd="${t}">${due?dur(now-t)+' önce':dur(t-now)}</span>
          <span>${esc(n.task||'(yapılacak yazılmamış)')}</span></div>`;
      }else h+=`<div class="msg ok">Tüm adımlar tamam. Eline sağlık!</div>`;
      h+=`<div class="steps">${e.steps.slice().sort((a,b)=>num(a.h)-num(b.h)).map(s=>{const t=at(e,s),due=t<=now;
        const b=s.done?'<span class="badge ok">Yapıldı</span>':due?'<span class="badge bad">Zamanı geldi</span>':`<span class="badge info" data-left="${t}">${dur(t-now)} kaldı</span>`;
        return `<label class="stp ${s.done?'done':''}" data-s="${s.id}"><input type="checkbox" data-a="tick" ${s.done?'checked':''}>
          <div><div class="when"><strong>${fmt(num(s.h),num(s.h)%1?1:0)}. saat</strong><span class="muted">${dateStr(t)}</span>${b}</div>
          <div class="task">${esc(s.task||'(boş)')}</div></div></label>`}).join('')}</div>
        <div class="actions"><button data-a="cal">Takvime ekle</button><button data-a="edit">Düzenle</button>
        ${u.confirmDel?`<span class="small">Deney silinsin mi?</span><button class="danger sm" data-a="delyes">Evet</button><button class="sm" data-a="delno">Vazgeç</button>`:`<button class="ghost danger" data-a="del">${n?'Sil':'Deneyi kaldır'}</button>`}</div>`;
    }
    return h+'</div></article>';
  }).join('');
}
const box=$('exps');
const expOf=el=>{const c=el.closest('[data-id]');return c&&st.exps.find(x=>x.id===c.dataset.id)};
const stepOf=(e,el)=>{const r=el.closest('[data-s]');return r&&e.steps.find(s=>s.id===r.dataset.s)};
box.addEventListener('change',ev=>{
  const t=ev.target;if(t.dataset.a!=='tick')return;const e=expOf(t),s=stepOf(e,t);s.done=t.checked;persist();renderExps()});
box.addEventListener('input',ev=>{
  const t=ev.target,e=expOf(t);if(!e)return;
  if(t.dataset.e==='name')e.name=t.value;
  else if(t.dataset.e==='start'){if(t.value){e.start=new Date(t.value).toISOString();e.notified={}}}
  else if(t.dataset.sk){const s=stepOf(e,t);s[t.dataset.sk]=t.value;if(t.dataset.sk==='h'){delete e.notified[s.id];delete e.notified['p'+s.id]}}
  persist();
});
box.addEventListener('click',ev=>{
  const b=ev.target.closest('button[data-a]');if(!b)return;const e=expOf(b);if(!e)return;const a=b.dataset.a;ui[e.id]=ui[e.id]||{};
  if(a==='cal'){
    const now=Date.now();const evs=e.steps.filter(s=>!s.done&&at(e,s)>now).map(s=>({title:`${e.name}: ${s.h}. saat`,start:new Date(at(e,s)),minutes:30,
      desc:(s.task||'')+(e.lines.length?`\nHatlar: ${e.lines.join(', ')}`:'')+`\nBaşlangıç: ${dateStr(e.start)}`,alarms:[0,30]}));
    if(Lab.addToCalendar('deney-adimlari.ics',evs)){ui[e.id].fresh=false;renderExps()}
    else{b.textContent='Gelecek adım yok';setTimeout(renderExps,1800)}
    return}
  if(a==='edit'){ui[e.id].edit=true;renderExps();return}
  if(a==='edone'){e.steps.sort((x,y)=>num(x.h)-num(y.h));e.steps.forEach(s=>{if(at(e,s)<Date.now()-6e5){e.notified[s.id]=1;e.notified['p'+s.id]=1}});ui[e.id].edit=false;persist();renderExps();return}
  if(a==='sadd'){const last=e.steps[e.steps.length-1];e.steps.push({id:uid(),h:String(last?num(last.h)+24:24),task:'',done:false});persist();renderExps();return}
  if(a==='sdel'){const s=stepOf(e,b);e.steps=e.steps.filter(x=>x!==s);persist();renderExps();return}
  if(a==='del'){ui[e.id].confirmDel=true;renderExps();return}
  if(a==='delno'){ui[e.id].confirmDel=false;renderExps();return}
  if(a==='delyes'){st.exps=st.exps.filter(x=>x!==e);persist();renderExps();return}
});

// ---------- hızlı sayaçlar
const PRESETS=[['Tripsin',5],['Santrifüj',5],['İnkübasyon',30],['MTT',240],['CCK-8',120]];
$('presets').innerHTML=PRESETS.map(([l,m])=>`<button type="button" class="sm" data-l="${esc(l)}" data-m="${m}">${esc(l)} · ${m>=60?m/60+' sa':m+' dk'}</button>`).join('');
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)startTimer(b.dataset.l,+b.dataset.m)});
$('tGo').addEventListener('click',()=>{const m=num($('tMin').value);if(!(m>0)){$('tMin').focus();return}startTimer($('tLabel').value.trim()||'Sayaç',m);$('tLabel').value='';$('tMin').value=''});
function startTimer(label,min){st.timers.push({id:uid(),label,min,end:Date.now()+min*6e4,rang:false});persist();renderTimers()}
function renderTimers(){
  const now=Date.now();
  $('timers').innerHTML=st.timers.map(t=>{const left=t.end-now,fin=left<=0;
    return `<div class="timer ${fin?'fin':''}" data-t="${t.id}"><div><div class="small muted">${esc(t.label)} · ${fmt(t.min,t.min%1?1:0)} dk · bitiş ${timeStr(t.end)}</div>
      <div class="clk" data-clk="${t.end}">${fin?'Bitti!':clock(left)}</div></div>
      <div class="actions">${fin?'':'<button class="sm" data-ta="add1">+1 dk</button>'}<button class="sm ${fin?'primary':'ghost'}" data-ta="x">${fin?'Tamam':'İptal'}</button></div></div>`}).join('');
}
$('timers').addEventListener('click',e=>{const b=e.target.closest('[data-ta]');if(!b)return;const id=b.closest('[data-t]').dataset.t;const t=st.timers.find(x=>x.id===id);
  if(b.dataset.ta==='x')st.timers=st.timers.filter(x=>x!==t);else{t.end+=6e4;t.min+=1}persist();renderTimers();alarmBar()});

// ---------- alarm şeridi
function alarmBar(){
  const now=Date.now();const items=[];
  st.timers.filter(t=>t.end<=now).forEach(t=>items.push(`⏰ <strong>${esc(t.label)}</strong> bitti`));
  st.exps.forEach(e=>e.steps.forEach(s=>{if(!s.done&&at(e,s)<=now&&now-at(e,s)<6*36e5)items.push(`⏰ <strong>${esc(e.name)}</strong>: ${esc(s.h)}. saat geldi`)}));
  const a=$('alarm');a.hidden=!items.length;a.innerHTML=items.length?`<div class="msg bad">${items.join('<br>')}</div>`:'';
}

// ---------- saniyelik döngü
function tick(){
  const now=Date.now();let changed=false;
  document.querySelectorAll('[data-clk]').forEach(el=>{const end=+el.dataset.clk;el.textContent=end<=now?'Bitti!':clock(end-now)});
  document.querySelectorAll('[data-cd]').forEach(el=>{const t=+el.dataset.cd;el.textContent=t<=now?dur(now-t)+' önce':dur(t-now)});
  st.timers.forEach(t=>{if(!t.rang&&t.end<=now){t.rang=true;changed=true;if(now-t.end<6e5)Lab.notify(`${t.label} bitti`,`${fmt(t.min,0)} dakikalık sayaç doldu.`,'t'+t.id)}});
  st.exps.forEach(e=>e.steps.forEach(s=>{if(s.done)return;const t=at(e,s);
    if(!e.notified['p'+s.id]&&t-now<=30*6e4&&t>now){e.notified['p'+s.id]=1;changed=true;Lab.notify(`${e.name}: 30 dk sonra ${s.h}. saat`,s.task||'',`p${s.id}`)}
    if(!e.notified[s.id]&&t<=now){e.notified[s.id]=1;e.notified['p'+s.id]=1;changed=true;if(now-t<6e5)Lab.notify(`${e.name}: ${s.h}. saat geldi`,s.task||'',s.id)}
  }));
  if(changed){persist();renderTimers();const a=document.activeElement;if(!(a&&a.matches('input,textarea,select')))renderExps()}
  alarmBar();
}
// dakikalık: "x kaldı" rozetlerini tazele
setInterval(()=>{const a=document.activeElement;if(!(a&&a.matches('input,textarea,select')))renderExps()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

notifBox();newForm();renderExps();renderTimers();tick();setInterval(tick,1000);
})();
</script>
</body>
</html>
